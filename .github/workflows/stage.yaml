name: stage

on:
  push:
    branches:
      - stage
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build-and-push:
    uses: realiotech/workflows/.github/workflows/docker.yaml@main
    with:
      DEPLOY: false
      DOCKERFILE: Dockerfile
      DOCKER_BUILD_CONTEXT: .
      ENVIRONMENT: stage
      IMAGE_NAME: blockscout-frontend
      PUSH: true
      RUN_NUMBER: ${{ github.run_number }}
      SHA: ${{ github.sha }}
      BUILD_ARGS: |
        GIT_COMMIT_SHA=${{ github.sha }}
        GIT_TAG=v2.10.3
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.DO_REGISTRY_PASSWORD_STAGE }}
